version: '3.9'

services:
  # ─── API Gateway ─────────────────────────────────────────────────
  gateway:
    build:
      context: ./backend/gateway
      dockerfile: Dockerfile
    container_name: career-bridge-gateway
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - FRONTEND_URL=http://localhost:3000
      - DATABASE_URL=mysql://career_bridge:career_bridge_secret@mysql:3306/career_bridge
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mysql
      - redis
    networks:
      - career-bridge-net
    restart: unless-stopped

  # ─── Web Application ─────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: career-bridge-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://gateway:4000/api
      - NEXT_PUBLIC_WS_URL=ws://gateway:4000
      - NEXT_PUBLIC_USE_MOCK=true
    depends_on:
      - gateway
    networks:
      - career-bridge-net
    restart: unless-stopped

  # ─── MySQL ────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: career-bridge-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: career_bridge
      MYSQL_USER: career_bridge
      MYSQL_PASSWORD: career_bridge_secret
      MYSQL_ROOT_PASSWORD: root_secret_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/gateway/src/modules/assessment/migrations/001_assessment_tables.up.sql:/docker-entrypoint-initdb.d/01-assessment-tables.sql:ro
    networks:
      - career-bridge-net
    restart: unless-stopped

  # ─── Redis ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: career-bridge-redis
    ports:
      - "6379:6379"
    networks:
      - career-bridge-net
    restart: unless-stopped

  # ─── MongoDB ──────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: career-bridge-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: career_bridge
    volumes:
      - mongo_data:/data/db
    networks:
      - career-bridge-net
    restart: unless-stopped

volumes:
  mysql_data:
  mongo_data:

networks:
  career-bridge-net:
    driver: bridge
