version: '3.9'

services:
  # ─── API Gateway ─────────────────────────────────────────────────
  gateway:
    build:
      context: ./backend/gateway
      dockerfile: Dockerfile
    container_name: career-bridge-gateway
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - FRONTEND_URL=http://localhost:3000
      - DATABASE_URL=postgresql://career_bridge:career_bridge_secret@postgres:5432/career_bridge
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - career-bridge-net
    restart: unless-stopped

  # ─── Web Application ─────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: career-bridge-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://gateway:4000/api
      - NEXT_PUBLIC_WS_URL=ws://gateway:4000
      - NEXT_PUBLIC_USE_MOCK=true
    depends_on:
      - gateway
    networks:
      - career-bridge-net
    restart: unless-stopped

  # ─── PostgreSQL ───────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: career-bridge-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: career_bridge
      POSTGRES_USER: career_bridge
      POSTGRES_PASSWORD: career_bridge_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/gateway/src/modules/assessment/migrations/001_assessment_tables.up.sql:/docker-entrypoint-initdb.d/01-assessment-tables.sql:ro
    networks:
      - career-bridge-net
    restart: unless-stopped

  # ─── Redis ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: career-bridge-redis
    ports:
      - "6379:6379"
    networks:
      - career-bridge-net
    restart: unless-stopped

  # ─── MongoDB ──────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: career-bridge-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: career_bridge
    volumes:
      - mongo_data:/data/db
    networks:
      - career-bridge-net
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:

networks:
  career-bridge-net:
    driver: bridge
